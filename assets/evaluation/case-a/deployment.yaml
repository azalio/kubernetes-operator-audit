# SYNTHETIC: excerpt for static audit, never apply.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloud-db-controller
spec:
  replicas: 2
  template:
    spec:
      serviceAccountName: cloud-db
      containers:
        - name: manager
          image: example.invalid/controller:v1
          args: ["--leader-elect=false"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: cloud-db
rules:
  - apiGroups: ["*"]
    resources: ["*"]
    verbs: ["*"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: cloud-db
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cloud-db
subjects:
  - kind: ServiceAccount
    name: cloud-db
    namespace: operators
